name: deploy

on:
  push:
    branches:
      - main

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Install MyST Markdown
        run: npm install -g mystmd

      - name: Build HTML Assets
        run: myst build --html

      # MyST has no production-URL setting for static builds; it writes the
      # local build-server address into the sitemap and robots.txt.
      - name: Set production URL in sitemap and robots.txt
        run: |
          for f in _build/html/sitemap.xml _build/html/robots.txt; do
            if [ -f "$f" ]; then
              sed -i -E 's#http://localhost:[0-9]+#https://zhang-soil-hydrology-lab.github.io#g' "$f"
            else
              echo "::warning::$f not found; skipping URL rewrite"
            fi
          done

      - name: Verify no localhost URLs remain
        run: |
          status=0
          for f in _build/html/sitemap.xml _build/html/robots.txt; do
            if [ -f "$f" ] && grep -n 'http://localhost' "$f"; then
              echo "::error::$f still contains a localhost URL"
              status=1
            fi
          done
          exit $status

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./_build/html"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
